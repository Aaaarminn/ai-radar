name: ai-radar

on:
  workflow_dispatch: {}       # 手动触发（云端模式请打开下面两行 cron；注意与本机模式二选一，否则双倍发信）
  # schedule:
  #   - cron: '0,30 * * * *'

permissions:
  contents: write

concurrency:
  group: ai-radar
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install certifi

      - name: Run radar
        env:
          # 推送通道（配了哪个用哪个，未配置的自动跳过）
          WECOM_WEBHOOK:  ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          SMTP_TO:        ${{ secrets.SMTP_TO }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID:   ${{ secrets.WXPUSHER_UID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 摘要 API（OpenAI 兼容；不配则用抽取式摘要；Claude CLI 模式仅本地可用）
          SUMMARY_API_KEY:  ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_API_BASE: ${{ secrets.SUMMARY_API_BASE }}
          SUMMARY_MODEL:    ${{ secrets.SUMMARY_MODEL }}
          SUMMARY_LANGUAGE: ${{ secrets.SUMMARY_LANGUAGE }}
          # 云端直连通常不需要代理；置空禁用本机代理回退
          RADAR_PROXY: ''
        run: python radar.py

      - name: Commit state
        run: |
          git config user.name  "ai-radar-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state update $(date -u +%FT%TZ)" && git push)
